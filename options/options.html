<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <section>
    <h2>Copying</h2>
    <label><input type="checkbox" id="cleanLinks"> Remove tracking parameters from copied links</label>
    <p class="hint">Strips things like <code>utm_source</code>, <code>fbclid</code> and <code>gclid</code>, which only record where a click came from. The link still opens the same page.</p>
  </section>
  <script src="options.js"></script>
</body>
</html>
